# XRays - name rules of the built-in categories.
version: 0.1.0
#
# The mod ships this file in BepInEx\plugins (it is looked for there, beside
# its own assembly and in BepInEx\scripts) and copies it into BepInEx\config
# at launch: the copy of BepInEx\config is the one read, again every time it
# changes while the game runs. The mod writes its own version on the
# "version" line above, so a copy that is missing, or written for another
# version of the mod, is replaced by the shipped file again: keep that line as
# it is when the file is edited, and copy an edited file aside before the mod
# is updated.
#
# This file is the only source: the code holds no name rule at all, a list it
# does not carry is empty, and a category it does not carry has no name rule.
# Categories are named by their key: trees, ores, rocks, pickable, build,
# creatures, items, plants, spawners, clutter, locations. A key naming none of
# them is written to the log, it is usually a typo.
#
# The five lists of a category, every one of them matched against the raw name
# of the game object ("(Clone)" included when the game clones one):
#   nameContains         case-insensitive substrings the category claims
#   nameStartsWith       case-insensitive prefixes it claims
#   nameMatches          regular expressions it claims, searched in the name
#                        (^ and $ anchor a pattern covering the whole name)
#   nameExcludes         case-insensitive substrings given away to another
#                        category, which is how the ore veins are kept out
#                        of the rocks
#   nameExcludesMatches  regular expressions given away the same way
#
# Values sit between single quotes: nothing is escaped in them, so a regular
# expression keeps its backslash, ^Rock_\d+$ written once. Between double
# quotes a backslash has to be written twice ("^Rock_\\d+$") and "\d" is a
# parse error.
#
# A list belongs to one category only: telling ores what it claims does not
# keep rocks from claiming the same names, so both sides are written - which
# is what nameExcludes is for.

# "clutter" = Grass / vegetation: bushes, ferns, reeds, moss, mushrooms and
# flowers only carry a Destructible, no component of their own, so the
# substrings claim them. The instanced grass is claimed through
# InstanceRenderer instead.
clutter:
  nameContains:
    - 'bush'
    - 'shrub'
    - 'grass'
    - 'fern'
    - 'reed'
    - 'moss'
    - 'mushroom'
    - 'flower'

# "ores" = Ores: an ore vein and a plain stone carry the very same components,
# so only the name tells them apart. A giant piece of the Mistlands corpses
# behaves the same way - the intact one carries a Destructible, the broken one
# a MineRock5 like a plain stone - and a family token claims the whole
# giant_... family and nothing else: the Morkhalla railings and the
# GiantBloodSack item stay out of its reach.
ores:
  nameContains:
    - '_copper'
    - 'silver'
    - 'obsidian'
    - 'flametal'
    - 'MineRock_Tin'
    - 'giant_ribs'
    - 'giant_skull'
    - 'giant_sword'

# "rocks" = Rocks: the mineable rocks carry MineRock5 / MineRock, while a
# boulder or a cliff only carries a Destructible, so the substrings claim
# those. The ore veins carry those very components as well, so nameExcludes
# hands every one of their names over to Ores: the two lists are written
# apart, on purpose, and have to name the same things.
rocks:
  nameContains:
    - 'rock'
    - 'boulder'
    - 'stone'
    - 'cliff'
  nameExcludes:
    - '_copper'
    - 'silver'
    - 'obsidian'
    - 'flametal'
    - 'MineRock_Tin'
    - 'giant_ribs'
    - 'giant_skull'
    - 'giant_sword'

# "spawners" = Spawners: CreatureSpawner, SpawnArea and TriggerSpawner claim
# the vanilla ones. The prefix below catches a modded spawner carrying none of
# them - every one of those prefabs is named "Spawner..." - taken from the
# start of the name, so the model pieces and the effects whose name merely
# contains that word stay out.
spawners:
  nameStartsWith:
    - 'spawner'

# "trees" = Trees: TreeBase and TreeLog claim the real trees. The small
# decorative trees, the stubs, the roots and the branches only carry a
# Destructible, so the substrings claim them as well: without them they would
# never be hidden with the rest of the forest.
trees:
  nameContains:
    - 'tree'
    - 'birch'
    - 'beech'
    - 'oak'
    - 'stump'
    - 'stub'
    - 'root'
    - 'branch'
